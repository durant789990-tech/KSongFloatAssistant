plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zzy.ksongfloat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zzy.ksongfloat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

def releaseApkDir = rootProject.file('release_apk')

tasks.configureEach { task ->
    if (task.name == 'assembleDebug' || task.name == 'assembleRelease') {
        task.doLast {
            def variant = task.name == 'assembleDebug' ? 'debug' : 'release'
            def src = file("${layout.buildDirectory.get()}/outputs/apk/${variant}/app-${variant}.apk")
            if (!src.exists()) {
                logger.lifecycle("Skip APK copy: ${src} not found")
                return
            }
            releaseApkDir.mkdirs()
            copy {
                from src
                into releaseApkDir
                rename { 'KSongAssistant.apk' }
            }
            logger.lifecycle("Copied APK -> ${releaseApkDir}/KSongAssistant.apk")
        }
    }
}
